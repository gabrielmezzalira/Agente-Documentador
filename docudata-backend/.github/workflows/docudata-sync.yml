name: DocuData Sync

on:
  push:

env:
  DOCUDATA_PROJECT_ID: SUBSTITUIR_PELO_ID_DO_PROJETO
  DOCUDATA_API_URL: https://agente-documentador-production.up.railway.app

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Buscar sprint atual do DocuData
        id: sprint
        run: |
          SPRINT=$(curl -sf "$DOCUDATA_API_URL/projects/$DOCUDATA_PROJECT_ID/current-sprint" | jq -r '.sprint_number // 1')
          echo "numero=$SPRINT" >> $GITHUB_OUTPUT

      - name: Enviar commit para DocuData
        run: |
          COMMIT_HASH=$(git log -1 --pretty=format:"%H")
          COMMIT_MSG=$(git log -1 --pretty=format:"%B")
          AUTHOR=$(git log -1 --pretty=format:"%an")
          DATE=$(git log -1 --pretty=format:"%ad")
          BRANCH="${GITHUB_REF_NAME}"
          DIFF_STAT=$(git diff HEAD~1 HEAD --stat)
          DIFF=$(git diff HEAD~1 HEAD -- '*.py' '*.ts' '*.tsx' '*.js' '*.sql' | head -500)

          curl -f -X POST "$DOCUDATA_API_URL/ingest/commit" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg project_id "$DOCUDATA_PROJECT_ID" \
              --argjson sprint "${{ steps.sprint.outputs.numero }}" \
              --arg hash "$COMMIT_HASH" \
              --arg msg "$COMMIT_MSG" \
              --arg author "$AUTHOR" \
              --arg date "$DATE" \
              --arg branch "$BRANCH" \
              --arg stat "$DIFF_STAT" \
              --arg diff "$DIFF" \
              '{project_id: $project_id, sprint_number: $sprint, commit_hash: $hash, commit_message: $msg, author: $author, date: $date, branch: $branch, diff_stat: $stat, diff: $diff}')"
